services:
  mysql:
    image: mysql:8.4
    container_name: cs-pulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cs_pulse
      MYSQL_USER: cs_pulse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
